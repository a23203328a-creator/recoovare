<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Mensajes para asesoras – Recoovare</title><link rel="icon" href="../fotos/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
<style>
*{box-sizing:border-box} body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:#FAF7F2;color:#3B2A22}
header{background:#fff;border-bottom:1px solid #E8E0D8} .in{max-width:760px;margin:0 auto;padding:12px 16px}
header .in{display:flex;align-items:center;gap:14px;flex-wrap:wrap} header img{height:32px} h1{margin:0;font-size:19px;color:#4A2618}
main .in{display:flex;flex-direction:column;gap:12px;padding-top:16px;padding-bottom:40px}
.intro{margin:0;color:#5E4E45;font-size:15px}
.msg{background:#fff;border:1.5px solid #A7814F;border-radius:14px;padding:14px}
.cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
h2{margin:0;font-size:16px;color:#4A2618} .cuando{margin:2px 0 0;font-size:13px;color:#5E4E45}
.texto{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px;font-size:15.5px;line-height:1.5;background:#FAF7F2;border-radius:10px;padding:10px 12px}
.copiar{font:inherit;font-weight:800;font-size:15px;min-height:44px;min-width:92px;padding:8px 14px;border-radius:10px;border:0;background:#157A40;color:#fff;cursor:pointer;flex:none}
.copiar.ok{background:#4A2618}

.tipo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid #E8E0D8;border-radius:14px;padding:10px 12px;position:sticky;top:0;z-index:2}
.tipo span{font-weight:800;font-size:15px}
.seg{display:inline-flex;background:#F4EFE9;border-radius:999px;padding:3px}
.seg button{font:inherit;font-weight:800;font-size:15px;min-height:40px;padding:6px 18px;border:0;border-radius:999px;background:transparent;color:#5E4E45;cursor:pointer}
.seg button[aria-pressed="true"]{background:#4A2618;color:#fff}
.etapa{margin:14px 0 0;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5A6762}
.nuevo{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;background:#F3E3C3;color:#6A3E12;border-radius:999px;padding:1px 8px;vertical-align:middle}
</style></head><body>
<header><div class="in"><img src="../fotos/logo.png" alt="Recoovare"><h1>Mensajes listos para WhatsApp</h1></div></header>
<main><div class="in">
<p class="intro">Elige quién manda y si el pedido es placa o lápida, toca <b>Copiar</b> y pégalo en el chat del cliente.</p>
<div class="tipo"><span>Quién manda:</span><select id="quien" style="font:inherit;font-weight:700;font-size:15px;min-height:40px;border:1px solid #D9CFC6;border-radius:10px;padding:4px 10px;background:#fff"><option value="">Josmar</option><option value="soemy">Soemy</option><option value="maryfer">Maryfer</option><option value="ileana">Ileana</option><option value="josue">Josue</option></select><span style="margin-left:6px">El pedido es:</span><div class="seg" role="group" aria-label="Tipo de pedido"><button type="button" data-t="placa" aria-pressed="true">Placa</button><button type="button" data-t="lápida" aria-pressed="false">Lápida</button></div></div>
<div id="lista"></div>
</div></main>
<script>
var MAPA='https://maps.app.goo.gl/8GmmaSbQXzLBScMY9';
var M=[
 {e:'Primer contacto'},
 {t:'Mandar el catálogo',n:1,c:'Cuando alguien pide modelos o precios. El link ya lleva tu nombre para que el pedido te llegue a ti.',m:'¡Hola! 😊 Soy {q}, mucho gusto.\n\nAquí puedes ver todos nuestros modelos de placas y lápidas con sus precios por medida:\n👉 {l}\n\nCuando elijas uno, toca "Mandar a hacer mi boceto", llena tus datos y te llega todo por aquí. Te hago tu boceto digital gratis y sin compromiso. ✨\n\nCualquier duda, me puedes decir. 😊'},
 {e:'Al recibir el pedido'},
 {t:'Pedido recibido',c:'Cuando el pedido trae todos los datos.',m:'¡Gracias por su pedido! 😊 Ya estamos preparando su boceto, se lo comparto por aquí en unas 1 a 2 horas. ✨'},
 {t:'Faltan datos',n:1,c:'Cuando falta algo. Cambia ___ por lo que falta (por ejemplo: la dirección que llevará la placa).',m:'¡Gracias! 😊 Para preparar su boceto solo me falta: ___. En cuanto me lo comparta, empezamos. ✨'},
 {t:'Con imagen de referencia',c:'Cuando el cliente manda una foto o imagen que le gustó.',m:'¡Claro! 😊 Tomamos su imagen como referencia y la adaptamos a la medida de su {p}. Le mando el boceto para que lo revise antes de aprobarlo. ✨'},
 {t:'Diseño sin referencia',c:'Cuando quiere algo personalizado pero no tiene imagen.',m:'{d}'},
 {e:'Boceto'},
 {t:'Boceto listo',c:'Cuando Lancer te manda el boceto. Es la única vez que se le pide aprobarlo. Si el cliente aprueba, reenvía su respuesta a Lancer.',m:'¡Su boceto está listo! ✨ Revise que {r} estén correctos. Si quiere algún cambio, con gusto lo ajustamos; si así le gusta, confírmeme para continuar. 😊\nUna vez aprobado ya no se pueden hacer cambios.'},
 {t:'Boceto con cambios',c:'Después de cada corrección. No vuelvas a preguntar si así está bien.',m:'Aquí está su boceto con los cambios que nos pidió. ✨'},
 {t:'Seguimiento del boceto',c:'Si no responde después de recibir su boceto. Solo una vez; no insistas.',m:'¡Hola, buen día! 😊 ¿Pudo revisar su boceto? Quedo pendiente. ✨'},
 {e:'Anticipo'},
 {t:'Aprobado + anticipo',c:'En cuanto el cliente aprueba su boceto.',m:'¡Perfecto, gracias! 😊 Para comenzar solo pedimos un anticipo de $150; el resto lo paga al recibirla. Puede pagar en el local, por transferencia o en OXXO. ¿Cuál prefiere?'},
 {t:'Datos para pagar',n:1,c:'Cuando elige transferencia u OXXO. Mándalo junto con la imagen de datos de pago.',m:'Le comparto los datos para su anticipo de $150:\n💳 BBVA · Wendy Ileana Quiñones Encalada\n4152 3142 1231 7278\nAl hacerlo, mándeme su comprobante por aquí, por favor. 😊'},
 {t:'Anticipo confirmado + nota',c:'Solo cuando Lancer ya confirmó el pago. Mándalo junto con el PDF de la nota.',m:'¡Anticipo recibido, gracias! ✅ Su {p} estará lista en 2 a 3 días hábiles. Le comparto su nota con el folio y el saldo pendiente. Le aviso por aquí cuando esté lista. ✨'},
 {e:'Pedido listo'},
 {t:'Lista · envío a domicilio',c:'Cuando Lancer confirma que está terminada y pidió envío.',m:'¡Su {p} ya está lista! 🎉 ¿Me comparte su ubicación de Google Maps y qué día y horario le queda bien para recibirla?'},
 {t:'Lista · instalación',n:1,c:'Cuando Lancer confirma que está terminada y pidió instalación.',m:'¡Su {p} ya está lista! 🎉 Para agendar la instalación, ¿me comparte su ubicación de Google Maps y qué día y horario le queda bien?'},
 {t:'Lista · recoger',c:'Cuando Lancer confirma que está terminada y pasa a recogerla.',m:'¡Su {p} ya está lista para recoger! 🎉\n📍 Calle 46a4 #965 x 143 y 145, Villamagna del Sur\n🕒 Lunes a domingo, 11 a.m. a 7 p.m.\n'+MAPA},
 {e:'Al final'},
 {t:'Agradecimiento',c:'Cuando ya recibió su pedido y liquidó.',m:'¡Gracias por confiar en Recoovare! 🤎 Esperamos que le encante. Aquí estamos cuando necesite otro diseño. ✨'}
];
var tipo='placa',quien='';
try{quien=localStorage.getItem('recoovare_msj_quien')||''}catch(e){}
var NOMBRES={'':'Josmar',soemy:'Soemy',maryfer:'Maryfer',ileana:'Ileana',josue:'Josue'};
try{tipo=localStorage.getItem('recoovare_msj_tipo')||'placa'}catch(e){}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function texto(i){return M[i].m.replace(/\{q\}/g,NOMBRES[quien]).replace(/\{l\}/g,'https://recoovare.pages.dev'+(quien?'/'+quien:'')).replace(/\{p\}/g,tipo).replace(/\{r\}/g,tipo==='placa'?'apellidos, dirección y textos':'nombres, fechas y textos').replace(/\{d\}/g,tipo==='placa'?'¡Con gusto! 😊 ¿Qué colores, flores o estilo le gustaría para su placa? Si hay algo que no quiera, también dígame. ✨':'¡Con gusto! 😊 ¿Qué colores, flores o estilo le gustaría para su lápida? Si desea incluir una foto o una frase, puede mandármela por aquí. ✨')}
function pintar(){
  var n=0;
  document.getElementById('lista').innerHTML=M.map(function(x,i){
    if(x.e)return '<h2 class="etapa">'+esc(x.e)+'</h2>';
    n++;
    return '<article class="msg" style="margin-top:10px"><div class="cab"><div><h2>'+n+' · '+esc(x.t)+(x.n?'<span class="nuevo">Nuevo</span>':'')+'</h2><p class="cuando">'+esc(x.c)+'</p></div><button type="button" class="copiar" data-i="'+i+'">Copiar</button></div><div class="texto">'+esc(texto(i))+'</div></article>';
  }).join('');
  document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.t===tipo?'true':'false')});
}
function copiar(t,b){
  var ok=function(){b.textContent='¡Copiado!';b.classList.add('ok');setTimeout(function(){b.textContent='Copiar';b.classList.remove('ok')},1600)};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,function(){viejo(t);ok()})}else{viejo(t);ok()}
}
function viejo(t){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}
document.addEventListener('click',function(e){
  var b=e.target.closest('.copiar');if(b){copiar(texto(+b.dataset.i),b);return}
  var s=e.target.closest('.seg button');if(s){tipo=s.dataset.t;try{localStorage.setItem('recoovare_msj_tipo',tipo)}catch(er){}pintar()}
});
document.getElementById('quien').value=quien;
document.getElementById('quien').addEventListener('change',function(e){quien=e.target.value;try{localStorage.setItem('recoovare_msj_quien',quien)}catch(er){}pintar()});
pintar();
</script>
</body></html>
